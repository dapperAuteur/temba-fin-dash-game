	budget(filter: BudgetFilter, order: BudgetOrder, first: Int, offset: Int): [Budget] @hasInverse(field: tag)
	comment(filter: CommentFilter, order: CommentOrder, first: Int, offset: Int): [Comment] @hasInverse(field: tag)
	financialAccount(filter: FinancialAccountFilter, order: FinancialAccountOrder, first: Int, offset: Int): [FinancialAccount] @hasInverse(field: tag)
	game(filter: GameFilter, order: GameOrder, first: Int, offset: Int): [Game] @hasInverse(field: tag)
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: tag)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: tag)
	person(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: tag)
