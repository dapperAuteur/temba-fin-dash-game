	tagAggregate(filter: TagFilter): TagAggregateResult
}

type Verbo {
	id: ID!
	cambiar_de_irregular: String @search(by: [hash])
	categoria_de_irregular: String @search(by: [hash])
	english: String @search(by: [hash])
	spanish: String @search(by: [hash])
	grupo: Float @search
	irregular: Boolean
	reflexive: Boolean
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: verbo)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: verbo)
	terminacion: AllowedTerminacion @search(by: [exact])
