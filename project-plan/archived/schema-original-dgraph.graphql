	blogPost(filter: BlogPostFilter): BlogPost @hasInverse(field: note)
	budget(filter: BudgetFilter): Budget @hasInverse(field: note)
	comment(filter: CommentFilter): Comment @hasInverse(field: note)
	financialAccount(filter: FinancialAccountFilter): FinancialAccount @hasInverse(field: note)
	game(filter: GameFilter): Game @hasInverse(field: note)
	media(filter: MediaFilter): Media @hasInverse(field: note)
