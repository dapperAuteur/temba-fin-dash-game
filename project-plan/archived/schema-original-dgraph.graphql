	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: word)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: word)
	tier: Int @search
	tongue: String @search(by: [hash])
