type Person {
	id: ID!
	activity(filter: ActivityFilter, order: ActivityOrder, first: Int, offset: Int): [Activity] @hasInverse(field: person)
	associate(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: associate)
	blogPost(filter: BlogPostFilter, order: BlogPostOrder, first: Int, offset: Int): [BlogPost] @hasInverse(field: author)
	budget(filter: BudgetFilter, order: BudgetOrder, first: Int, offset: Int): [Budget] @hasInverse(field: partner)
	comment(filter: CommentFilter, order: CommentOrder, first: Int, offset: Int): [Comment] @hasInverse(field: author)
