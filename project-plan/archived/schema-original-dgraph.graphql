	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: person)
	nickname: [String] @search(by: [hash])
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: person)
	password: String
	profileImageUrl(filter: MediaFilter): Media
	role: Int @search
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: person)
	transaction(filter: TransactionFilter, order: TransactionOrder, first: Int, offset: Int): [Transaction] @hasInverse(field: participant)
	activityAggregate(filter: ActivityFilter): ActivityAggregateResult
	associateAggregate(filter: PersonFilter): PersonAggregateResult
	blogPostAggregate(filter: BlogPostFilter): BlogPostAggregateResult
	budgetAggregate(filter: BudgetFilter): BudgetAggregateResult
	commentAggregate(filter: CommentFilter): CommentAggregateResult
	financialAccountAggregate(filter: FinancialAccountFilter): FinancialAccountAggregateResult
	gameAggregate(filter: GameFilter): GameAggregateResult
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
