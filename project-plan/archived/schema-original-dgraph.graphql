	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: transaction)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: transaction)
	occurrence: DateTime @search
	participant(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: transaction)
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: transaction)
	transactionEvent: String @search(by: [hash])
	budgetAggregate(filter: BudgetFilter): BudgetAggregateResult
	financialAccountAggregate(filter: FinancialAccountFilter): FinancialAccountAggregateResult
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
