	person(filter: PersonFilter): Person @hasInverse(field: note)
	tag(filter: TagFilter): Tag @hasInverse(field: note)
	transaction(filter: TransactionFilter): Transaction @hasInverse(field: note)
	vendor(filter: VendorFilter): Vendor @hasInverse(field: note)
	verbo(filter: VerboFilter): Verbo @hasInverse(field: note)
	word(filter: WordFilter): Word @hasInverse(field: note)
