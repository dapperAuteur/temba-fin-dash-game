#######################
# Input Schema
#######################

enum AllowedCurrency {
	USD
	ETHEREUM
	SPANK
	BOOTY
	BITCOIN
}

enum AllowedTerminacion {
	AR
	ER
	IR
}

enum AllowedTongue {
	ENGLISH
	SPANISH
}

enum AllowedTypeAffix {
	PREFIX
	PREFIXIOID
	INFIX
	CIRCUMFIX
	INTERFIX
	DUPLIFIX
	TRANSFIX
	SIMULFIX
	SUPRAFIX
	DISFIX
	STEM
	SUFFIX
	SUFFIXOID
	NA
}

enum MediaType {
	AUDIO
	IMAGE
	TEXT
	VIDEO
}

type Account {
	id: ID
	type: String
	provider: String @search(by: [hash])
	providerAccountId: String @search(by: [hash])
	refreshToken: String
	expires_at: Int64
	accessToken: String
	token_type: String
	refresh_token: String
	access_token: String
	scope: String
	id_token: String
	session_state: String
	user(filter: UserFilter): User @hasInverse(field: "accounts")
}

type Activity {
	id: ID!
	endTime: DateTime @search
	startTime: DateTime @search
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: activity)
	name: String @search(by: [hash])
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: activity)
	person(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: activity)
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: activity)
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	personAggregate(filter: PersonFilter): PersonAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
}

type Affix {
	id: ID!
	example: [String] @search(by: [hash])
	meaning: [String] @search(by: [fulltext,hash])
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: affix)
	morpheme: String @search(by: [hash])
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: affix)
	tongue: AllowedTongue @search(by: [exact])
	type: [AllowedTypeAffix]
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
}

type BlogPost {
	id: ID!
	author(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: blogPost)
	body: String @search(by: [fulltext])
	comment(filter: CommentFilter, order: CommentOrder, first: Int, offset: Int): [Comment] @hasInverse(field: blogPost)
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: blogPost)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: blogPost)
	publishDate: DateTime @search
	published: Boolean
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: blogPost)
	title: String! @search(by: [hash])
	authorAggregate(filter: PersonFilter): PersonAggregateResult
	commentAggregate(filter: CommentFilter): CommentAggregateResult
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
}

type Budget {
	id: ID!
	budgetName: String! @search(by: [hash])
	budgetValue: Float @search
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: budget)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: budget)
	partner(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: budget)
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: budget)
	transaction(filter: TransactionFilter, order: TransactionOrder, first: Int, offset: Int): [Transaction] @hasInverse(field: budget)
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	partnerAggregate(filter: PersonFilter): PersonAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
	transactionAggregate(filter: TransactionFilter): TransactionAggregateResult
}

type Comment {
	id: ID!
	author(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: comment)
	blogPost(filter: BlogPostFilter, order: BlogPostOrder, first: Int, offset: Int): [BlogPost] @hasInverse(field: comment)
	body: String @search(by: [fulltext])
	comment(filter: CommentFilter, order: CommentOrder, first: Int, offset: Int): [Comment] @hasInverse(field: comment)
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: comment)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: comment)
	publishDate: DateTime @search
	published: Boolean
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: comment)
	authorAggregate(filter: PersonFilter): PersonAggregateResult
	blogPostAggregate(filter: BlogPostFilter): BlogPostAggregateResult
	commentAggregate(filter: CommentFilter): CommentAggregateResult
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
}

type FinancialAccount {
	id: ID!
	accountName: String! @search(by: [hash])
	currentValue: Float @search
	media(filter: MediaFilter, order: MediaOrder, first: Int, offset: Int): [Media] @hasInverse(field: financialAccount)
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: financialAccount)
	owner(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: financialAccount)
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: financialAccount)
	transaction(filter: TransactionFilter, order: TransactionOrder, first: Int, offset: Int): [Transaction] @hasInverse(field: financialAccount)
	mediaAggregate(filter: MediaFilter): MediaAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	ownerAggregate(filter: PersonFilter): PersonAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
	transactionAggregate(filter: TransactionFilter): TransactionAggregateResult
}

type Game {
	id: ID!
	attempts: Int @search
	bulls: Int @search
	cows: Int @search
	guess: [String]
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: game)
	player(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: game)
	score: Int @search
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: game)
	winningWord: String @search(by: [hash])
	won: Boolean
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	playerAggregate(filter: PersonFilter): PersonAggregateResult
	tagAggregate(filter: TagFilter): TagAggregateResult
}

type Media {
	id: ID!
	activity(filter: ActivityFilter, order: ActivityOrder, first: Int, offset: Int): [Activity] @hasInverse(field: media)
	affix(filter: AffixFilter, order: AffixOrder, first: Int, offset: Int): [Affix] @hasInverse(field: media)
	blogPost(filter: BlogPostFilter, order: BlogPostOrder, first: Int, offset: Int): [BlogPost] @hasInverse(field: media)
	budget(filter: BudgetFilter, order: BudgetOrder, first: Int, offset: Int): [Budget] @hasInverse(field: media)
	comment(filter: CommentFilter, order: CommentOrder, first: Int, offset: Int): [Comment] @hasInverse(field: media)
	financialAccount(filter: FinancialAccountFilter, order: FinancialAccountOrder, first: Int, offset: Int): [FinancialAccount] @hasInverse(field: media)
	link: String
	note(filter: NoteFilter, order: NoteOrder, first: Int, offset: Int): [Note] @hasInverse(field: media)
	occurrance: DateTime @search
	person(filter: PersonFilter, order: PersonOrder, first: Int, offset: Int): [Person] @hasInverse(field: media)
	tag(filter: TagFilter, order: TagOrder, first: Int, offset: Int): [Tag] @hasInverse(field: media)
	transaction(filter: TransactionFilter, order: TransactionOrder, first: Int, offset: Int): [Transaction] @hasInverse(field: media)
	type: MediaType
	vendor(filter: VendorFilter, order: VendorOrder, first: Int, offset: Int): [Vendor] @hasInverse(field: media)
	verbo(filter: VerboFilter, order: VerboOrder, first: Int, offset: Int): [Verbo] @hasInverse(field: media)
	word(filter: WordFilter, order: WordOrder, first: Int, offset: Int): [Word] @hasInverse(field: media)
	activityAggregate(filter: ActivityFilter): ActivityAggregateResult
	affixAggregate(filter: AffixFilter): AffixAggregateResult
	blogPostAggregate(filter: BlogPostFilter): BlogPostAggregateResult
	budgetAggregate(filter: BudgetFilter): BudgetAggregateResult
	commentAggregate(filter: CommentFilter): CommentAggregateResult
	financialAccountAggregate(filter: FinancialAccountFilter): FinancialAccountAggregateResult
	noteAggregate(filter: NoteFilter): NoteAggregateResult
	personAggregate(filter: PersonFilter): PersonAggregateResult
